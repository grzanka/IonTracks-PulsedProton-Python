name: Deploy

# Continuous deploy to GitHub Pages, gated on CI passing on master. Publishes
# the web/ prototype's static build to this repo's own GitHub Pages site at
# https://grzanka.github.io/IonTracks-PulsedProton-Python/.
#
# Deploys only fire once ci.yml has run to completion on master and
# succeeded -- a push that breaks format/lint/typecheck/tests no longer
# publishes. workflow_dispatch is kept for manual re-deploys without a new
# push.
#
# ci.yml also runs on pull_request, so workflow_run fires for PR CI too --
# the build job's `if` requires event == 'push' (excludes PR-triggered runs,
# including a fork PR whose head branch happens to be named "master") and
# head_repository == this repo, so only an actual push to this repo's master
# branch can reach the checkout/build/deploy steps below.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress production runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/core

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- -y

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm run build
        env:
          # GitHub Pages serves this project site under /IonTracks-PulsedProton-Python.
          BASE_PATH: /IonTracks-PulsedProton-Python

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
