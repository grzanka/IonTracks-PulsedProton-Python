# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # web/'s SvelteKit app.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"

  # web/core's Rust crate.
  - package-ecosystem: "cargo"
    directory: "/web/core"
    schedule:
      interval: "weekly"
    groups:
      # rand_pcg's PCG64 impl depends on the same rand_core version rand
      # itself pins, so bumping one without the other breaks the build with
      # two incompatible rand_core traits in scope (hit this for real going
      # 0.8/0.3 -> 0.10/0.10 -- see the PR that added this grouping).
      rand:
        patterns:
          - "rand"
          - "rand_core"
          - "rand_pcg"

  # Action version pins (e.g. actions/checkout@v4) never update on their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
