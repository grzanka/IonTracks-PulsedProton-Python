[package]
name = "pulsed-ion-chamber-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust/WASM port of pulsed_ion_chamber's single-species drift-diffusion-recombination solver (browser prototype)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.8", default-features = false }
rand_pcg = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
